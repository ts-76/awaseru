name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - name: Verify Secretlint offline with synthetic data
        run: node .harness/security/verify-security-tools.mjs --project "$GITHUB_WORKSPACE" --linux-sudo
      - name: Scan project offline with Secretlint
        run: |
          sudo -n unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" npm run secretlint
